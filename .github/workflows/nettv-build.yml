# Builds "Luncher NETTV" (this fork, com.kushal.luncher) for the NETTV box: the release APK, signed
# with the fork's own key, uploaded as the run's artifact. Runs on every push to the nettv branch,
# or by hand (Actions -> NETTV build -> Run workflow).
#
# Secrets: NETTV_KEYSTORE_BASE64 (the PKCS12 keystore, base64, key alias "luncher") and
# NETTV_KEYSTORE_PASSWORD. The same key must sign every build, or Android won't update the app.
name: NETTV build

on:
  push:
    branches: [nettv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the release APK (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.NETTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NETTV_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the secrets NETTV_KEYSTORE_BASE64 and NETTV_KEYSTORE_PASSWORD."
            exit 1
          fi
          keystore="$RUNNER_TEMP/nettv.p12"
          trap 'rm -f "$keystore"' EXIT
          base64 -d <<< "$KEYSTORE_BASE64" > "$keystore"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias luncher --v4-signing-enabled false \
            --out luncher-nettv.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$build_tools/apksigner" verify --print-certs luncher-nettv.apk
          sha256sum luncher-nettv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: luncher-nettv
          path: luncher-nettv.apk
          if-no-files-found: error
